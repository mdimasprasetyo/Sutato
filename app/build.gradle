plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.sutato'
    compileSdk 34

    defaultConfig {
        applicationId "app.sutato"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"  // ✅ Match Java version
    }

    // Release signing comes from environment variables or Gradle properties (for example in
    // ~/.gradle/gradle.properties or CI secrets), never from files in this repository:
    //   SUTATO_KEYSTORE_PATH, SUTATO_KEYSTORE_PASSWORD, SUTATO_KEY_ALIAS, SUTATO_KEY_PASSWORD
    // When they are absent the release build falls back to the debug key so it still builds.
    def signingValue = { String name ->
        def v = System.getenv(name) ?: (project.findProperty(name) as String)
        return v?.trim() ? v : null
    }
    def keystorePath = signingValue('SUTATO_KEYSTORE_PATH')
    def keystorePassword = signingValue('SUTATO_KEYSTORE_PASSWORD')
    def keyAliasValue = signingValue('SUTATO_KEY_ALIAS')
    def keyPasswordValue = signingValue('SUTATO_KEY_PASSWORD')
    def hasReleaseSigning = keystorePath && keystorePassword && keyAliasValue && keyPasswordValue

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystorePath) // absolute, or relative to the repo root
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('Sutato: SUTATO_KEYSTORE_* not set; release build is signed with the debug key.')
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
